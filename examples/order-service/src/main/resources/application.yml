spring:
  application:
    name: outbox-order-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/outbox}
    username: ${DATABASE_USER:outbox}
    password: ${DATABASE_PASSWORD:outbox}
  flyway:
    locations:
      - classpath:db/outbox/postgresql
      - classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

outbox:
  relay:
    batch-size: 100
    poll-interval: 250ms
    lease-duration: 30s
    max-attempts: 10
    cleanup:
      retention: 7d
      interval: 1h
